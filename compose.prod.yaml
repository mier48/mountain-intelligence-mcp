# Production overlay for a public VPS (see README, "Despliegue en VPS").
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build --wait
#   (or put COMPOSE_FILE=compose.yaml:compose.prod.yaml in .env and use plain `docker compose …`)
#
# Caddy terminates TLS with automatic Let's Encrypt certificates and is the ONLY published service
# (80/443). The MCP container is no longer published on the host: Caddy reaches it over the Docker
# network. Requires Docker Compose v2.24+ (`!reset`).

services:
  mountain-intelligence-mcp:
    command: ["mountain-intelligence-mcp", "http", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports: !reset []
    environment:
      # Port 8000 is reachable only from containers on the Compose networks (i.e. Caddy), so its
      # X-Forwarded-For can be trusted; the per-IP rate limit then sees the real client address.
      FORWARDED_ALLOW_IPS: "*"
      # Host allowlist (DNS-rebinding protection) derived from the public domain. localhost stays
      # allowed for `docker compose exec` diagnostics; it is not reachable from outside.
      MCP_ALLOWED_HOSTS: "${MCP_PUBLIC_DOMAIN:?set MCP_PUBLIC_DOMAIN in .env},localhost,localhost:*,127.0.0.1,127.0.0.1:*"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"          # ACME HTTP-01 challenge + redirect to HTTPS
      - "443:443"        # HTTPS
      - "443:443/udp"    # HTTP/3
    environment:
      MCP_PUBLIC_DOMAIN: ${MCP_PUBLIC_DOMAIN:?set MCP_PUBLIC_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates and ACME account: keep this volume
      - caddy_config:/config
    depends_on:
      mountain-intelligence-mcp: {condition: service_healthy}
    networks: [public]

volumes:
  caddy_data:
  caddy_config:
