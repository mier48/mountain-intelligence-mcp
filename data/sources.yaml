    provides: [prices, availability, identifiers]
    route: "Awin affiliate programme with daily product data feeds (up to ~270,000 products)."
    status: requires_agreement
    notes: >-
      Feeds are licensed to approved affiliates under programme terms that assume tracked links.
      Affiliation is out of scope for this project: only usable with an explicit data agreement.
    references: [https://ui.awin.com/merchant-profile/125904]
