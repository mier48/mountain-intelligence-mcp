sources:
  # Priority order from the specification: boots + crampons first, then packs and apparel.
  - slug: petzl-website
    name: Petzl official website (sitemap + JSON-LD)
    brand: Petzl
    source_type: manufacturer_website
    adapter: jsonld_product
    base_url: https://www.petzl.com/
    allowed_domains: [www.petzl.com]
    access_status: restricted
    terms_reviewed_at: 2026-11-24
    access_notes: >-
      Legal notice: site and content for private, personal, non-commercial use; reproduction or
      distribution without prior written consent is prohibited. Needs written permission or a feed.
    references: [https://www.petzl.com/INT/en/legal]
    enabled: false
    sync_frequency_hours: 168
    categories: [crampon, ice_axe, climbing_helmet]
    config:
      discovery: sitemap
      sitemap_url: https://www.petzl.com/int/en/sitemap_index.xml
      url_include: ["/Sport/Crampons/", "/Sport/Ice-axes/", "/Sport/Helmets/"]
      category_rules:
        - {pattern: "/Crampons/", category: crampon}
        - {pattern: "/Ice-axes/", category: ice_axe}
        - {pattern: "/Helmets/", category: climbing_helmet}
      max_urls: 200

  - slug: grivel-website
    name: Grivel official website (Shopify, JSON-LD)
    brand: Grivel
    source_type: manufacturer_website
    adapter: jsonld_product
    base_url: https://grivel.com/
    allowed_domains: [grivel.com, www.grivel.com]
    access_status: unverified
    access_notes: >-
      robots.txt explicitly allows several AI crawlers, but no licence for catalog reuse was found.
      Request permission or a data feed (crampon binding and size data are key for compatibility).
    references: [https://www.grivel.com/robots.txt]
    enabled: false
    sync_frequency_hours: 168
    categories: [crampon, ice_axe, climbing_helmet]
    config:
      discovery: sitemap
      sitemap_url: https://grivel.com/sitemap.xml
      url_include: ["/products/"]
      category_rules:
        - {pattern: "crampon|g10|g12|g14|g20|g22|air-tech|rambo", category: crampon}
        - {pattern: "helmet|casco|stealth|salamander|duetto|mutant", category: climbing_helmet}
      default_category: ice_axe
      max_urls: 200

  - slug: scarpa-website
    name: Scarpa official website (Shopify, JSON-LD)
