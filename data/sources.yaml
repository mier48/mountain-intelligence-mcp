# Registry of brands and sources (version-controlled). Validate / apply with:
#   python manage.py import_sources --check
#   python manage.py import_sources
#
# Listing a brand or source here does NOT imply any agreement, technical access or permission.
# A source can only be enabled with access_status `authorized` or `terms_permit` (validated here,
# in code and by a database CHECK constraint). robots.txt permissions are recorded as technical
# facts only: they do not grant reuse rights. Details: docs/source-evaluation.md.
#
# Brand fields after `integration_status` (country, verified_at, robots, sitemaps, evidence, notes)
# document the evaluation and are not stored in the database. `candidate_sources` lists data routes
# without an adapter yet (documentation only).
