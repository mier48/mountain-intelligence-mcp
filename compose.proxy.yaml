# Alternative production overlay for a VPS where ports 80/443 already belong to another reverse proxy
# (nginx, Caddy, Traefik, Nginx Proxy Manager…). Use it INSTEAD of compose.prod.yaml (README, "6b"):
#
#   COMPOSE_FILE=compose.yaml:compose.proxy.yaml   (in .env)
#
# No Caddy is started. The MCP endpoint stays bound to 127.0.0.1:${MCP_PUBLISHED_PORT:-8000} (from
# compose.yaml), so only processes on the host — the existing proxy — can reach it; that proxy terminates
# TLS and forwards /mcp and /healthz. Containerized proxies can instead join the `public` network and
# target mountain-intelligence-mcp:8000.

services:
  mountain-intelligence-mcp:
    command: ["mountain-intelligence-mcp", "http", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    environment:
      # The port is published on 127.0.0.1 only and the Compose networks hold no other client, so every
      # connection comes from the host proxy (seen as the Docker gateway IP) and X-Forwarded-For can be
      # trusted; the per-IP rate limit then sees the real client address.
      FORWARDED_ALLOW_IPS: "*"
      # Host allowlist (DNS-rebinding protection) derived from the public domain. localhost stays
      # allowed for `docker compose exec` diagnostics.
      MCP_ALLOWED_HOSTS: "${MCP_PUBLIC_DOMAIN:?set MCP_PUBLIC_DOMAIN in .env},localhost,localhost:*,127.0.0.1,127.0.0.1:*"
